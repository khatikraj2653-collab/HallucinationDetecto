name: Keep Streamlit app awake

on:
  schedule:
    - cron: '45 */3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping app
        run: |
          curl -fsSL --max-time 60 --retry 3 --retry-delay 5 \
            https://hallucinationdetecto.streamlit.app/ \
            -A "GitHub-Actions-Keepalive" \
            -o /dev/null
          echo "Pinged HallucinationDetecto OK at $(date -u)"
