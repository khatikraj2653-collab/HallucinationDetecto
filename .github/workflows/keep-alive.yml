name: Keep Streamlit app awake

on:
  schedule:
    # Every 3 hours, well inside Streamlit Community Cloud's 12-hour sleep
    # threshold, so the app never fully hibernates.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (Chromium only)
        run: |
          npm install playwright@latest
          npx playwright install --with-deps chromium

      - name: Visit the app and wake it if asleep
        env:
          APP_URL: https://hallucinationdetecto.streamlit.app/
        run: node .github/scripts/keep_alive.js
