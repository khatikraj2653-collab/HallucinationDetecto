name: Keep Streamlit app awake

on:
  schedule:
    - cron: '45 */3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping app
        run: |
          curl -sSL --max-redirs 5 --max-time 90 \
            -A "GitHub-Actions-Keepalive" \
            -o /dev/null \
            -w "HTTP %{http_code} · %{num_redirects} redirect(s) · %{time_total}s\n" \
            https://hallucinationdetecto.streamlit.app/ || true
          echo "Pinged HallucinationDetecto OK at $(date -u)"
